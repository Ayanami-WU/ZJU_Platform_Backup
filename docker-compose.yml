services:
    app:
        build:
            context: .
            target: production
        restart: unless-stopped
        ports:
            - "127.0.0.1:5181:5181"
        env_file:
            - path: ./server/.env
              required: false
        environment:
            NODE_ENV: production
            PORT: "5181"
            SERVER_HOST: 0.0.0.0
            SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the environment or --env-file}
            DATABASE_FILE: /app/server/data/database.sqlite
            BACKGROUND_TASKS_DISABLED: ${BACKGROUND_TASKS_DISABLED:-1}
            CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://tuotuzju.com,https://www.tuotuzju.com,capacitor://localhost}
        volumes:
            - data:/app/server/data
            - uploads:/app/server/uploads
            - logs:/app/server/logs
            - backups:/app/server/backups

    dev:
        profiles: [development]
        build:
            context: .
            target: development
        ports:
            - "127.0.0.1:5180:5180"
            - "127.0.0.1:5181:5181"
        env_file:
            - path: ./server/.env
              required: false
        environment:
            NODE_ENV: development
            PORT: "5181"
            SERVER_HOST: 0.0.0.0
            SECRET_KEY: ${SECRET_KEY:?Set a local development SECRET_KEY}
            DATABASE_FILE: /app/server/data/database.sqlite
            BACKGROUND_TASKS_DISABLED: "1"
            VITE_API_PROXY_TARGET: http://127.0.0.1:5181
            CORS_ALLOWED_ORIGINS: http://localhost:5180,http://127.0.0.1:5180
        volumes:
            - .:/app
            - /app/node_modules
            - /app/server/node_modules
            - dev-data:/app/server/data
            - dev-uploads:/app/server/uploads

    backup:
        profiles: [with-backup]
        build:
            context: .
            target: production
        restart: unless-stopped
        healthcheck:
            disable: true
        environment:
            DATABASE_FILE: /app/server/data/database.sqlite
            BACKUP_DIR: /app/server/backups
        volumes:
            - data:/app/server/data:ro
            - backups:/app/server/backups
        command:
            - sh
            - -c
            - "while true; do npm run backup || exit 1; sleep 86400; done"

volumes:
    data:
    uploads:
    logs:
    backups:
    dev-data:
    dev-uploads:
